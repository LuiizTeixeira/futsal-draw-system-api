services:
  postgres:
    image: postgres
    container_name: futsal-draw-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-futsal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futsal_password}
      POSTGRES_DB: ${POSTGRES_DB:-db_futsal_draw_system_api}
      DATA: /data/postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres:/data/postgres
      - ./src/main/resources/db/migration/init:/docker-entrypoint-initdb.d
    networks:
      - futsal-draw-system-api-network
    restart: always

  pgAdmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgAdmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - futsal-draw-system-api-network
    depends_on:
      - postgres

  sonarqube:
    image: sonarqube
    hostname: sonarqube
    container_name: sonarqube
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    networks:
      - futsal-draw-system-api-network


networks:
  futsal-draw-system-api-network:
    name: futsal-draw-system-api-network
    driver: bridge

volumes:
  postgres:
    name: postgres-volume
  pgAdmin:
    name: pgadmin-volume
  sonarqube_data:
    name: sonarqube-data-volume
  sonarqube_extensions:
    name: sonarqube-extensions-volume
  sonarqube_logs:
    name: sonarqube-logs-volume
