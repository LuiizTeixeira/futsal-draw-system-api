spring:
  datasource:
    url: jdbc:h2:mem:futsal_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    default-schema: futsal
    create-schemas: true

  logging:
    level:
      org.hibernate.orm.jdbc.bind: TRACE
      org.hibernate.SQL: DEBUG
      org.hibernate.orm.jdbc.extract: TRACE
